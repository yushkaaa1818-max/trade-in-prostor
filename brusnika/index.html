<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Брусника для агентов</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap">
<style>
/* Layout: стиль «Простор» — светлый фон, белые скруглённые карточки, синий бренд, оранжевый акцент; слева меню разделов */
:root{
  --bg:#eef2f7; --surface:#f5f7fb; --card:#fff; --ink:#012e45; --muted:#536774; --line:#dce5ec;
  --blue:#1879d4; --blue-soft:#ddebf8; --accent:#f89332; --accent-soft:#fee9d6; --lav:#dddef8; --mint:#dcf5e8;
  --red:#d6153c; --agent-soft:#fdecef; --green:#14804a; --land:#e6edf4; --mkad:#a9bccb; --river:#bfd8ee;
  --display:"Trebuchet MS","Lato",Arial,sans-serif; --text:"Lato","Trebuchet MS",Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--text);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
a{color:inherit}

.shell{max-width:1320px;margin:0 auto;padding-block:16px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:240px minmax(0,1fr);gap:18px;align-items:start}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);display:flex;flex-direction:column;gap:12px}
.brandcard{background:var(--card);border-radius:26px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.brand img{display:block;width:100%;max-width:204px;height:auto}
.brand b{display:block;font-family:var(--display);font-size:19px;letter-spacing:.04em;color:var(--blue);line-height:1}
.brand small{display:block;font-size:12px;color:var(--blue);margin-top:2px}
.internal{background:var(--accent-soft);color:#8a4a0b;border-radius:16px;padding:7px 12px;font-size:13px;font-weight:700}
.nav{background:var(--card);border-radius:26px;padding:10px;display:flex;flex-direction:column;gap:4px}
.nav a{display:flex;justify-content:space-between;align-items:center;gap:8px;text-decoration:none;border-radius:18px;padding:10px 14px;font-weight:700;font-size:15px}
.nav a:hover{background:var(--surface)}
.nav a.on{background:var(--blue);color:#fff}
.nav a.sub{font-weight:400;font-size:14px;padding:7px 14px}
.nav a.sub i{font-style:normal;font-size:12px;background:var(--blue-soft);color:var(--ink);border-radius:10px;padding:1px 8px}
.nav a.on i{background:#fff}
.nav hr{border:0;border-top:1px solid var(--line);margin:6px 8px}
.nav .cap{font-size:12px;color:var(--muted);padding:4px 14px 0}
main{display:flex;flex-direction:column;gap:18px;min-width:0}

.hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px}
.hero-main{background:var(--card);border-radius:26px;padding:26px 28px;display:flex;flex-direction:column;gap:10px}
.eyebrow{color:var(--blue);font-weight:700;font-size:15px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(26px,3.4vw,34px);margin:0;line-height:1.15;text-wrap:balance}
h2{font-family:var(--display);font-weight:400;font-size:clamp(22px,2.6vw,28px);margin:0;line-height:1.2;text-wrap:balance}
.hero-main p{margin:0;color:var(--muted)}
.terms-line{color:var(--blue);font-weight:700}
.hero-note{margin-top:auto;background:var(--surface);border-radius:18px;padding:12px 16px;font-size:14px;color:var(--muted)}
.hero-note b{color:var(--ink)}
.tiles{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.tile{border-radius:22px;padding:16px 18px;display:flex;flex-direction:column;justify-content:space-between;gap:8px;min-height:104px;text-decoration:none}
.tile b{font-family:var(--display);font-weight:700;font-size:30px;line-height:1}
.tile span{font-size:14px}
.t-blue{grid-column:span 3;background:var(--blue);color:#fff}
.t-blue b{font-size:42px}
.t-peach{grid-column:span 3;background:var(--accent-soft)}
.t-sky{grid-column:span 2;background:var(--blue-soft)}
.t-lav{grid-column:span 2;background:var(--lav)}
.t-mint{grid-column:span 2;background:var(--mint)}
.t-sky b,.t-lav b,.t-mint b{font-size:clamp(20px,2.2vw,28px);overflow-wrap:anywhere}
a.tile:hover{filter:brightness(.97)}

.sechead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;padding:6px 4px 0}
.sechead .fine{margin-left:auto}
.fine{font-size:13px;color:var(--muted)}

/* map */
.mapwrap{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:18px}
.mapbox{background:var(--card);border-radius:26px;padding:12px;position:relative}
.mapvp{position:relative;height:clamp(380px,58vh,620px);overflow:hidden;border-radius:18px;background:#e8ece6;touch-action:none;cursor:grab;user-select:none}
.mapvp:active{cursor:grabbing}
.mapin{position:absolute;left:0;top:0;transform-origin:0 0;--s:1}
.mapin img{display:block;max-width:none;width:100%;height:100%;pointer-events:none}
.pin{position:absolute;transform:translate(-50%,-100%) scale(calc(1 / var(--s)));transform-origin:50% 100%;display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;z-index:1}
.pin:hover,.pin:focus-visible{z-index:3}
.pb{display:flex;align-items:center;gap:8px;background:#fff;border-radius:16px;padding:9px 14px 9px 11px;font-weight:700;font-size:17px;color:#111;box-shadow:0 3px 14px rgba(1,46,69,.22);white-space:nowrap;position:relative}
.pb::after{content:"";position:absolute;left:50%;bottom:-6px;width:12px;height:12px;background:#fff;transform:translateX(-50%) rotate(45deg);border-radius:2px}
.pb svg{width:20px;height:20px;color:var(--blue)}
.pn{font-size:12px;font-weight:700;color:var(--ink);background:rgba(255,255,255,.85);border-radius:8px;padding:1px 7px;margin-top:6px;white-space:nowrap}
.pin:hover .pb,.pin:focus-visible .pb{background:var(--blue);color:#fff}
.pin:hover .pb::after,.pin:focus-visible .pb::after{background:var(--blue)}
.pin:hover .pb svg,.pin:focus-visible .pb svg{color:#fff}
.mapctl{position:absolute;right:24px;top:24px;display:flex;flex-direction:column;gap:6px;z-index:4}
.mapctl button{width:40px;height:40px;border:0;border-radius:12px;background:#fff;box-shadow:0 2px 8px rgba(1,46,69,.18);font-size:22px;font-weight:700;color:var(--ink)}
.attrib{position:absolute;right:20px;bottom:16px;font-size:11px;background:rgba(255,255,255,.85);border-radius:6px;padding:1px 6px;color:var(--muted)}
.card.ag{border:1px solid var(--red)}
.nav a.sub.agn{background:var(--red);color:#fff;font-weight:700;margin:1px 0}
.nav a.sub.agn i{background:#fff;color:var(--red)}
.nav a.sub.agn:hover{background:#b8102f}
.nav a.sub.agn.on{background:#9e0d29;box-shadow:inset 0 0 0 2px #fff,0 0 0 2px var(--red)}
.lbox{display:flex;flex-direction:column;gap:12px}
.lwrap{position:relative;border-radius:18px;overflow:hidden;isolation:isolate}
.lmap{height:clamp(420px,62vh,640px);background:#eef1ec;font-family:var(--text)}
.lwrap.on{position:fixed;inset:0;z-index:1000;border-radius:0;background:var(--bg)}
.lwrap.on .lmap{height:100%}
body.noscroll{overflow:hidden}
.lfull{position:absolute;right:12px;top:12px;z-index:1001;border:0;background:#fff;border-radius:14px;padding:10px 14px;font-weight:700;font-size:14px;color:var(--ink);box-shadow:0 2px 10px rgba(1,46,69,.2)}
.lwrap.on .lfull{top:calc(12px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px))}
.lload{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:1001;background:#fff;color:var(--ink);font-weight:700;font-size:14px;border-radius:12px;padding:8px 14px;box-shadow:0 2px 10px rgba(1,46,69,.2);pointer-events:none}
.lhint{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);z-index:1001;background:rgba(1,46,69,.78);color:#fff;font-size:13px;border-radius:10px;padding:6px 12px;pointer-events:none;white-space:nowrap}
.ljk{display:flex;gap:8px;flex-wrap:wrap}
.ljk .chip{background:var(--surface)}
.ljk .chip i{background:var(--blue-soft)}
.lmk{background:none;border:0}
.lpin{position:absolute;left:0;top:0;transform:translate(-50%,calc(-100% - 6px));display:flex;flex-direction:column;align-items:center;cursor:pointer}
.lpb{display:flex;align-items:center;gap:6px;background:#fff;border-radius:12px;padding:6px 10px 6px 8px;font-weight:700;font-size:14px;color:#111;box-shadow:0 2px 10px rgba(1,46,69,.25);white-space:nowrap;position:relative;font-family:var(--text)}
.lpb::after{content:"";position:absolute;left:50%;bottom:-5px;width:10px;height:10px;background:inherit;transform:translateX(-50%) rotate(45deg);border-radius:2px}
.lpb svg{width:16px;height:16px;color:var(--blue)}
.lpin.hot .lpb{box-shadow:0 0 0 1.5px var(--red),0 2px 10px rgba(1,46,69,.25)}
.lpl{font-size:11px;font-weight:700;color:var(--ink);background:rgba(255,255,255,.9);border-radius:6px;padding:0 6px;margin-top:7px;white-space:nowrap;font-family:var(--text)}
.lpin:hover .lpb{background:var(--blue);color:#fff}
.lpin:hover .lpb svg{color:#fff}
.leaflet-popup-content-wrapper{border-radius:20px;box-shadow:0 6px 24px rgba(1,46,69,.25)}
.leaflet-popup-content{margin:16px 18px;font-family:var(--text);font-size:14px;line-height:1.4;color:var(--ink)}
.leaflet-popup-close-button{font-size:20px!important;width:28px!important;height:28px!important;top:6px!important;right:6px!important}
.leaflet-container a.leaflet-popup-close-button{color:var(--muted)}
.lpop{display:flex;flex-direction:column;gap:10px}
.lpn{font-family:var(--display);font-weight:400;font-size:21px;line-height:1.15}
.lpf{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;background:var(--surface);border-radius:14px;padding:10px 12px}
.lpf small{display:block;color:var(--muted);font-size:11.5px}
.lpf b{font-size:14px}
.lpop .btn{padding:9px 14px;font-size:14px}
.leaflet-container a.btn-main{color:#fff}
.leaflet-control-zoom a{width:36px!important;height:36px!important;line-height:36px!important;font-size:20px!important;color:var(--ink)!important}
.leaflet-control-zoom{border:0!important;box-shadow:0 2px 10px rgba(1,46,69,.2)!important;border-radius:12px!important;overflow:hidden}
.leaflet-bar a{background:#fff}
.leaflet-container .leaflet-control-attribution{font-size:10px;background:rgba(255,255,255,.8)}
.leaflet-tile{filter:none}
.calcs{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-top:4px}
.calc{background:var(--surface);border-radius:22px;padding:18px 20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.calc .who{font-size:13px;font-weight:700;color:var(--blue)}
.calc h4{margin:0;font-family:var(--display);font-weight:400;font-size:20px}
.calc .tkv{font-size:14.5px}
.cbig{background:var(--card);border-radius:16px;padding:10px 14px}
.cbig small{display:block;color:var(--muted);font-size:13px}
.cbig b{font-family:var(--display);font-size:28px;line-height:1.1}
.cnote{background:var(--accent-soft);border-radius:14px;padding:10px 12px;font-size:14px}
#calcbox{display:flex;flex-direction:column;gap:14px}
.disclaim{margin:0;font-size:12px;color:var(--muted);line-height:1.5}
.cbase{font-size:16px;background:var(--agent-soft);border:1px solid var(--red);color:var(--ink);border-radius:14px;padding:10px 14px}
.cbase b{color:var(--red);font-size:18px}
.calc-base .lbl{font-size:14px;color:var(--muted)}
.calc-base .chip{background:var(--surface)}
.calc-base .chip[aria-pressed="true"]{background:var(--blue);color:#fff}
.calchead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.pdfrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#pdfbtn svg{width:18px;height:18px}
#pdfbtn[disabled]{opacity:.6;cursor:progress}
.pdfmsg{font-size:14px;color:var(--muted)}
.pdfhost{position:fixed;left:-10000px;top:0;width:794px;z-index:-1}
.pdfdoc{width:794px;background:#fff;color:#012e45;padding:34px 38px;display:flex;flex-direction:column;gap:16px;font-family:var(--text)}
.pd-top{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #ddebf8;padding-bottom:12px}
.pd-logo{width:190px;height:auto}
.pd-date{text-align:right;font-size:13px;color:#536774;font-weight:700}
.pd-proj{display:flex;gap:16px;align-items:center}
.pd-proj img{width:170px;height:110px;object-fit:cover;border-radius:14px;flex:none}
.pd-eye{color:#1879d4;font-weight:700;font-size:13px}
.pd-pn{font-family:var(--display);font-size:26px;line-height:1.15}
.pd-sub{font-size:13px;color:#536774;margin-top:4px}
.pd-flat{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
.pd-plan{border:1px solid #dce5ec;border-radius:16px;aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#fff}
.pd-plan img{width:100%;height:100%;object-fit:contain;padding:8px}
.pd-plan span{font-size:13px;color:#536774}
.pd-info{display:flex;flex-direction:column;gap:12px}
.pd-ft{font-family:var(--display);font-size:24px}
.pd-kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:#f5f7fb;border-radius:12px;padding:10px 12px}
.pd-kv small{display:block;color:#536774;font-size:11.5px}
.pd-kv b{font-size:14px}
.pd-prices{display:flex;flex-direction:column;gap:6px}
.pr{display:flex;justify-content:space-between;gap:10px;font-size:14px;color:#536774}
.pr b{color:#012e45;white-space:nowrap}
.pr.red b{color:#d6153c}
.pr.ag,.pr.fin{border:1px solid #d6153c;background:#fdecef;border-radius:12px;padding:8px 10px;margin-top:4px;color:#d6153c;font-weight:700}
.pr.fin{border-color:#1879d4;background:#ddebf8;color:#012e45}
.pr.ag b,.pr.fin b{font-size:19px;color:inherit}
.pd-h{font-family:var(--display);font-size:20px;margin-top:4px}
.pdfdoc .calcs{grid-template-columns:repeat(3,1fr);gap:10px}
.pdfdoc .calc{padding:12px 14px;gap:8px;border-radius:14px}
.pdfdoc .calc h4{font-size:16px}
.pdfdoc .calc .tkv{font-size:12px;gap:3px 10px}
.pdfdoc .cbig b{font-size:20px}
.pdfdoc .cnote{font-size:12px}
.pdfdoc .cbase{font-size:14px;padding:8px 12px}
.pdfdoc .split{height:24px;font-size:11px}
.calc.fam{border:2px solid var(--blue-soft)}
.fctl{display:grid;grid-template-columns:1fr;gap:6px;align-items:center;background:var(--card);border-radius:14px;padding:10px 12px;font-size:13.5px}
.fctl label,.fctl .lbl2{color:var(--muted)}
.fctl .sel{background:var(--surface);padding:7px 10px;font-size:14px;min-width:0;width:100%}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:0;background:var(--surface);border-radius:12px;padding:6px 12px;font-weight:700;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--blue);color:#fff}
.pvrow{display:flex;align-items:center;gap:8px}
.pvrow input{flex:1;min-width:0;accent-color:var(--blue)}
.akcia.bk{background:#6b7379}
.card.bkd .plan img{opacity:.5}
.sched tr.cur td{background:var(--agent-soft)}
.nowtag{background:var(--red);color:#fff;border-radius:8px;padding:1px 7px;font-size:12px;margin-left:6px}
.akcia{position:absolute;right:10px;top:10px;background:var(--red);color:#fff;border-radius:12px;padding:7px 14px;font-weight:900;font-size:16px;line-height:1;letter-spacing:.02em}
.card.ag:hover{border-color:var(--red)}
.agent{display:flex;justify-content:space-between;align-items:center;gap:8px;border:1px solid var(--red);background:var(--agent-soft);border-radius:14px;padding:8px 12px;font-size:13.5px;color:var(--red);font-weight:700}
.agent b{font-size:18px;white-space:nowrap}
.agent.big{padding:12px 16px;font-size:15px}
.agent.big b{font-size:26px;font-family:var(--display)}
.agent small{display:block;font-weight:400;color:var(--muted)}
.tg.ag{background:var(--agent-soft);color:var(--red);border:1px solid var(--red)}
.pt{cursor:pointer}
.pt .halo{fill:var(--accent);opacity:.2}
.pt .dot{fill:var(--accent);stroke:#fff;stroke-width:3}
.pt.off .dot{fill:var(--mkad)}
.pt.off .halo{opacity:0}
.pt.on .dot{fill:var(--blue)}
.pt.on .halo{fill:var(--blue);opacity:.25}
.pt text{font-family:var(--text);font-weight:700;font-size:15px;fill:var(--ink);paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round}
.pt.off text{fill:var(--muted);font-weight:400;font-size:13px}
.maplegend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);padding:8px 6px 2px}
.maplegend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.mapside{background:var(--card);border-radius:26px;padding:20px 22px;display:flex;flex-direction:column;gap:12px}

/* project cards */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.pcard{background:var(--card);border-radius:26px;padding:20px 22px;display:flex;flex-direction:column;gap:14px;border:1px solid transparent;transition:border-color .15s,transform .15s;min-width:0}
.pcard:hover{border-color:var(--blue-soft);transform:translateY(-2px)}
.pcard.hl{border-color:var(--blue)}
.ptop{display:flex;justify-content:space-between;gap:10px;align-items:start}
.ptop h3{margin:0;font-family:var(--display);font-weight:400;font-size:23px;line-height:1.15}
.ptop .cnt{background:var(--blue);color:#fff;border-radius:14px;padding:6px 10px;text-align:center;line-height:1;flex:none}
.ptop .cnt b{display:block;font-size:20px;font-family:var(--display)}
.ptop .cnt small{font-size:11px}
.intro{color:var(--muted);font-size:14px;margin:0}
.metro{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13px}
.metro span{display:inline-flex;align-items:center;gap:5px}
.metro i{width:9px;height:9px;border-radius:50%;display:inline-block}
.pfacts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;background:var(--surface);border-radius:18px;padding:12px 14px}
.pfacts small{display:block;color:var(--muted);font-size:12.5px}
.pfacts b{font-size:16px}
.rooms{display:flex;gap:6px;flex-wrap:wrap}
.rooms span{background:var(--blue-soft);border-radius:10px;padding:3px 9px;font-size:13px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.tg{border-radius:10px;padding:4px 10px;font-size:13px;font-weight:700;background:var(--accent-soft);color:#8a4a0b}
.tg.b{background:var(--mint);color:var(--green)}
.tg.g{background:var(--lav);color:var(--ink);font-weight:400}
.pbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
.btn{border:0;border-radius:22px;padding:11px 18px;font-weight:700;font-size:15px;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn-main{background:var(--accent);color:#fff}
.btn-main:hover{background:#e7801f}
.btn-soft{background:var(--blue-soft);color:var(--blue)}
.btn-soft:hover{background:var(--blue);color:#fff}

/* filters + flat cards */
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.chip{border:0;background:var(--card);border-radius:22px;padding:9px 14px;display:inline-flex;gap:8px;align-items:center;font-size:15px}
.chip i{font-style:normal;background:var(--accent-soft);border-radius:12px;padding:1px 8px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--accent);color:#fff}
.chip[aria-pressed="true"] i{background:#fff;color:var(--ink)}
.sel{border:0;background:var(--card);border-radius:22px;padding:9px 14px;font-size:15px}
.sel.blue{background:var(--blue-soft);margin-left:auto}
.found{font-size:15px;color:var(--muted)}
.found b{color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.card{background:var(--card);border-radius:26px;padding:12px;display:flex;flex-direction:column;gap:12px;border:1px solid transparent;transition:border-color .15s,transform .15s;min-width:0}
.card:hover{border-color:var(--blue-soft);transform:translateY(-2px)}
.card-main{display:flex;flex-direction:column;gap:12px;text-decoration:none;flex:1}
.site-link{margin:0 8px 6px;display:flex;justify-content:center;gap:6px;background:var(--blue-soft);color:var(--blue);font-weight:700;font-size:15px;text-decoration:none;border-radius:18px;padding:11px 14px}
.site-link:hover{background:var(--blue);color:#fff}
.plan{position:relative;background:#fff;border:1px solid var(--line);border-radius:18px;aspect-ratio:4/3;max-width:100%;display:flex;align-items:center;justify-content:center;overflow:hidden}
.plan img{width:100%;height:100%;object-fit:contain;padding:28px 8px 8px}
.plan .noplan{font-size:13px;color:var(--muted);text-align:center;padding:16px}
.badges{position:absolute;left:10px;top:10px;display:flex;gap:6px;flex-wrap:wrap;max-width:90%}
.bd{border-radius:10px;padding:3px 9px;font-size:13px;font-weight:700}
.b-dark{background:var(--ink);color:#fff}
.b-soft{background:var(--blue-soft);color:var(--ink);font-weight:400}
.disc{position:absolute;right:10px;top:10px;background:var(--accent);color:#fff;border-radius:12px;padding:6px 10px;font-weight:900;font-size:16px;line-height:1;text-align:right}
.disc small{display:block;font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;opacity:.9;margin-bottom:2px}
.disc.aa{background:var(--red)}
.body{padding:2px 8px 8px;display:flex;flex-direction:column;gap:12px}
.ttl{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ttl h3{margin:0;font-family:var(--display);font-weight:400;font-size:20px}
.ttl span{color:var(--blue);font-size:14px;white-space:nowrap}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.facts small{display:block;color:var(--muted);font-size:13px}
.facts b{font-size:15px}
.prices{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:4px}
.pline{display:flex;justify-content:space-between;gap:8px;font-size:14px;color:var(--muted)}
.pline b{font-weight:700;white-space:nowrap}
.black{color:var(--ink)}
.red{color:var(--red)}
s.black{text-decoration-thickness:1px}
.final{display:flex;flex-direction:column;gap:2px;margin-top:6px;background:var(--surface);border-radius:16px;padding:10px 12px}
.final small{font-size:13px;color:var(--muted)}
.final b{font-family:var(--display);font-size:26px;font-weight:700;line-height:1.1}
.final .save{font-size:13px;color:var(--green);font-weight:700}
.mini{font-size:13px;color:var(--muted)}
.mini b{color:var(--ink)}
.empty{background:var(--card);border-radius:26px;padding:40px;text-align:center;color:var(--muted)}
.more{align-self:center}

/* detail */
.back-row{display:flex;gap:10px;flex-wrap:wrap}
.pill{border:0;background:var(--card);border-radius:22px;padding:10px 16px;color:var(--blue);font-weight:700;text-decoration:none;font-size:15px}
.detail{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
.panel{background:var(--card);border-radius:26px;padding:22px 24px;display:flex;flex-direction:column;gap:16px;min-width:0}
.panel.full{grid-column:1/-1}
.panel .tcard{background:var(--surface)}
.panel h3{margin:0;font-family:var(--display);font-weight:400;font-size:22px}
.dplan{position:relative;aspect-ratio:4/3;max-width:100%;display:flex;align-items:center;justify-content:center}
.dplan img{width:100%;height:100%;object-fit:contain;padding-top:30px}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.kv small{display:block;color:var(--muted);font-size:13px}
.kv b{font-size:16px}
.pbox{border-top:1px solid var(--line);padding-top:16px;display:flex;flex-direction:column;gap:6px}
.pbox .pline{font-size:15px}
.bigfinal small{color:var(--muted);font-size:14px}
.bigfinal b{display:block;font-family:var(--display);font-size:clamp(30px,4.4vw,42px);font-weight:700;line-height:1.05}
.bigfinal .save{color:var(--green);font-weight:700;font-size:14px}
.pm{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.pm div{background:var(--surface);border-radius:16px;padding:12px 14px}
.pm small{display:block;color:var(--muted);font-size:13px}
.pm b{font-family:var(--display);font-size:20px}
.soon{border:2px dashed var(--line);border-radius:18px;padding:16px;color:var(--muted);font-size:14px}
.copytext{width:100%;min-height:170px;border:1px solid var(--line);border-radius:14px;padding:12px;font-size:14px;resize:vertical}
.copy-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.copied{font-size:14px;color:var(--green);font-weight:700}

/* terms */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.tcard{background:var(--card);border-radius:22px;padding:18px 20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.tcard .who{font-size:13px;font-weight:700;color:var(--blue)}
.tcard h4{margin:2px 0 0;font-family:var(--display);font-weight:400;font-size:19px;line-height:1.2}
.rate{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-top:1px dashed var(--line);font-size:15px}
.rate:first-child{border-top:0}
.rate .v{font-weight:900;color:var(--accent);white-space:nowrap;font-size:17px}
.tkv{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:15px;margin:0}
.tkv dt{color:var(--muted)}
.tkv dd{margin:0;font-weight:700}
.split{display:flex;height:34px;border-radius:10px;overflow:hidden;font-size:13px;font-weight:700}
.split span{display:flex;align-items:center;justify-content:center;color:#fff;background:var(--blue)}
.split span:nth-child(2){background:var(--accent)}
.split span:nth-child(3){background:var(--ink)}
.split-cap{display:flex;font-size:12px;color:var(--muted);margin-top:4px}
.split-cap span{text-align:center}
.tblwrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px;font-variant-numeric:tabular-nums}
th,td{padding:9px 10px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:13px;color:var(--muted);font-weight:400}
td:first-child,th:first-child{text-align:left}
td.r{font-weight:900;color:var(--accent)}
.banner{background:var(--blue);color:#fff;border-radius:22px;padding:16px 20px;display:flex;gap:8px 20px;flex-wrap:wrap;align-items:center;font-size:15px}
.banner b{font-family:var(--display);font-size:19px;font-weight:700}
.note{background:var(--accent-soft);border-radius:18px;padding:14px 18px;font-size:15px}
.block{gap:18px;scroll-margin-top:16px}
.blkhead{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.blkhead h2{font-size:clamp(22px,2.6vw,28px)}
.blknum{width:44px;height:44px;border-radius:14px;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:20px;flex:none}
.blkhi{margin-left:auto;background:var(--accent);color:#fff;border-radius:14px;padding:8px 14px;font-weight:900;font-size:18px;white-space:nowrap}
.block .tcard{background:var(--surface)}
.grp{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:14px}
.grp h3{font-size:18px;color:var(--blue);font-family:var(--text);font-weight:700}
.warn{background:#fde4e9;color:var(--red);border-radius:12px;padding:8px 12px;font-size:13.5px;font-weight:700}
.bld-row .lbl{font-size:14px;color:var(--muted)}
.bld-row .chip[aria-pressed="true"]{background:var(--blue)}
.chip.red{background:var(--red);color:#fff;font-weight:700}
.chip.red i{background:#fff;color:var(--red)}
.bld-row .chip.red[aria-pressed="true"]{background:var(--red);box-shadow:0 0 0 3px var(--agent-soft),0 0 0 4px var(--red)}
.tile[data-blk]{cursor:pointer;font:inherit;color:inherit}
.tile[data-blk]:hover{filter:brightness(.97)}
.foot{font-size:13px;color:var(--muted);text-align:center;line-height:1.6;margin:8px 0 0}

@media (max-width:1100px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.hero,.mapwrap{grid-template-columns:1fr}}
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .side{position:static}
  .brandcard{flex-direction:row;align-items:center;flex-wrap:wrap;justify-content:space-between}

  .detail{grid-template-columns:1fr}
}

@media (prefers-reduced-motion:reduce){.card,.pcard{transition:none}.card:hover,.pcard:hover{transform:none}}

.phead{background:var(--card);border-radius:26px;overflow:hidden;display:flex;flex-direction:column}
.phead-top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;padding:26px 28px 22px;align-items:start}
.phead-txt{display:flex;flex-direction:column;gap:6px;min-width:0}
.phead-txt p{margin:0;color:var(--muted);font-size:17px}
.h-big{font-family:var(--display);font-weight:400;font-size:clamp(34px,5vw,58px);line-height:1.05;margin:4px 0 6px;text-wrap:balance}
.phead-stats{display:grid;grid-template-columns:repeat(2,minmax(150px,1fr));gap:12px}
.phead-stats .tile{min-height:110px;grid-column:auto}
.phead-strip{position:relative;height:200px;overflow:hidden}
.phead-strip img{width:100%;height:100%;object-fit:cover;display:block}
.phead-strip.open{height:120px}
.phbtn{position:absolute;left:20px;bottom:18px;border:0;background:#fff;border-radius:22px;padding:12px 20px;font-weight:700;font-size:16px;display:inline-flex;align-items:center;gap:10px;box-shadow:0 3px 14px rgba(1,46,69,.2)}
.phbtn svg{width:20px;height:20px}
.phbtn:hover{background:var(--blue);color:#fff}
.about{background:var(--card);border-radius:26px;padding:18px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:22px;align-items:stretch}
.about-txt{padding:18px 16px;display:flex;flex-direction:column;gap:10px}
.about-txt p{margin:0;line-height:1.6;font-size:16px}
.btn-blue{background:var(--blue);color:#fff}
.btn-blue:hover{background:#1166b5}
.mosaic{display:grid;grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr;gap:10px;min-height:340px}

.mz.big{grid-row:span 2}
.mz img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s}
.mz:hover img{transform:scale(1.03)}
.mz span{position:absolute;left:12px;bottom:12px;background:rgba(1,46,69,.85);color:#fff;border-radius:12px;padding:5px 11px;font-weight:700;font-size:14px}
.gpbox{background:var(--card);border-radius:26px;padding:12px;overflow:hidden}
.gpbox svg{display:block;width:100%;height:auto;border-radius:18px}
.gpoly{fill:rgba(24,121,212,.28);stroke:#fff;stroke-width:4;transition:fill .15s}

.gpb:hover .gpoly,.gpb:focus-visible .gpoly{fill:rgba(24,121,212,.55)}
.gpb.red .gpoly{fill:rgba(214,21,60,.3)}
.gpb.red:hover .gpoly,.gpb.red:focus-visible .gpoly{fill:rgba(214,21,60,.55)}
.gplab{fill:#fff;filter:drop-shadow(0 3px 8px rgba(1,46,69,.3))}
.gptx{font-family:var(--text);font-weight:700;font-size:30px;fill:var(--ink)}
.gpb.red .gptx{fill:var(--red)}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}
.bcard{border:1px solid transparent;background:var(--card);border-radius:26px;padding:12px;display:flex;flex-direction:column;gap:12px;text-align:left;font:inherit;color:inherit;transition:border-color .15s,transform .15s}
.bcard:hover{border-color:var(--blue);transform:translateY(-2px)}
.bcard.on{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
.bcard.red{border-color:var(--red)}
.bimg{position:relative;aspect-ratio:4/3;max-width:100%;border-radius:18px;overflow:hidden;background:var(--surface)}
.bimg svg{width:100%;height:100%;display:block}
.gpoly.on{fill:rgba(24,121,212,.35);stroke:#fff;stroke-width:5}
.bcard.red .gpoly.on{fill:rgba(214,21,60,.35)}
.bcnt{position:absolute;left:12px;bottom:12px;background:#fff;border-radius:14px;padding:5px 12px;font-weight:700;font-size:14px}
.bbody{display:flex;flex-direction:column;gap:6px;padding:2px 8px 6px}
.brow{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.brow b{font-family:var(--display);font-weight:400;font-size:24px}
.brow span{color:var(--muted);font-size:14px}
.brow .bpr{font-family:var(--text);font-weight:900;font-size:19px}
.gal{position:fixed;inset:0;z-index:2000;background:rgba(1,20,30,.92);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.gal img{max-width:100%;max-height:100%;object-fit:contain;border-radius:12px}
.gal button{position:absolute;border:0;background:#fff;color:var(--ink);border-radius:50%;width:46px;height:46px;font-size:24px;font-weight:700}
.gx{top:calc(16px + env(safe-area-inset-top,0px));right:calc(16px + env(safe-area-inset-right,0px))}
.gl{left:calc(16px + env(safe-area-inset-left,0px));top:50%;transform:translateY(-50%)}

.gc{position:absolute;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);color:#fff;font-size:14px}
#flist{scroll-margin-top:16px}
@media (max-width:900px){.phead-top{grid-template-columns:1fr}.about{grid-template-columns:1fr}.mosaic{min-height:260px}}
@media (max-width:620px){.phead-top{padding:20px}.phead-stats{grid-template-columns:1fr 1fr}.phead-strip{height:150px}.phbtn{left:14px;bottom:12px;padding:10px 16px;font-size:15px}.mosaic{grid-template-columns:1fr 1fr;grid-template-rows:auto auto}.mz.big{grid-column:span 2;grid-row:auto;aspect-ratio:16/10}.mz{aspect-ratio:4/3}.gptx{font-size:44px}}

/* Скидка агента по датам (по московскому времени) */
const AG_SCHED=[["2026-11-28",3],["2026-12-04",2.5],["2026-12-07",2],["2026-12-10",1.5],["2026-12-14",1],["2026-12-17",0.5],["2026-12-20",0]];
const AG_TODAY=(()=>{try{return new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Moscow',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}catch(e){return new Date().toISOString().slice(0,10)}})();
const AGENT=(()=>{let v=3; for(const [d,pc] of AG_SCHED) if(AG_TODAY>=d) v=pc; return v;})();
const AGS=String(AGENT).replace('.',',');
const AG_NEXT=AG_SCHED.find(([d,pc])=>d>AG_TODAY&&pc!==AGENT);
const dm=iso=>iso.slice(8,10)+'.'+iso.slice(5,7);
const prevDay=iso=>{const t=new Date(iso+'T12:00:00Z'); t.setUTCDate(t.getUTCDate()-1); return t.toISOString().slice(0,10);};
const AG_WHEN = AGENT>0 ? (AG_NEXT?` до ${dm(prevDay(AG_NEXT[0]))} включительно, с ${dm(AG_NEXT[0])} — ${String(AG_NEXT[1]).replace('.',',')}%`:'') : '';
const AG_NO = ['rublevskie-dvory','belata','dom-a'];
const agentOk = (slug,b) => AGENT>0 && !AG_NO.includes(slug) && !(slug==='izdanie' && b==='Дом 2');
const AG_RULE = 'Распространяется на все проекты, кроме Рублёвских дворов, Квартала «Белата», Издания дом 2 и Дома «А».';
function prep(f){
  f.final = f.promo || f.site;
  f.save = f.base - f.final;
  f.pct = Math.round(f.save/f.base*100);
  f.ppm = Math.round(f.final/f.a);
  f.slug = BY_ID[f.c].slug;
  f.ag = agentOk(f.slug,f.b) ? Math.round(f.final*(1-AGENT/100)) : null;
  return f;
}
const flatsOf = slug => FL.filter(f=>f.slug===slug);
function stats(list){
  const fin=list.map(f=>f.final);
  return {n:list.length, min:Math.min(...fin), max:Math.max(...fin), ppm:Math.min(...list.map(f=>f.ppm)),
    rooms:[0,1,2,3,4].map(r=>[r,list.filter(f=>r===4?f.r>=4:f.r===r).length]).filter(x=>x[1]),
    promo:list.filter(f=>f.promo).length, del:[...new Set(list.map(f=>f.d))]};
}

function mpx(lat,lon){const n=Math.pow(2,MAP.z)*256, r=lat*Math.PI/180;
  return [(lon+180)/360*n-MAP.ox, (1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2*n-MAP.oy];}

function initMap(){
  const el=document.getElementById('lmap'); if(!el) return;
  if(!window.L){el.innerHTML='<div class="empty">Карта не загрузилась. Обновите страницу.</div>';return;}
  if(LMAP){LMAP.remove();LMAP=null;}
  const B=L.latLngBounds([55.43,37.03],[55.97,38.07]);
  LMAP=L.map(el,{minZoom:9,maxZoom:14,maxBounds:B,maxBoundsViscosity:1,scrollWheelZoom:false,zoomSnap:0.5,attributionControl:true,zoomControl:true});
  LMAP.attributionControl.setPrefix(false);
  const layer=L.tileLayer('tiles/{z}/{x}/{y}.webp',{minZoom:9,maxZoom:14,minNativeZoom:9,maxNativeZoom:12,bounds:B,attribution:'© участники OpenStreetMap'}).addTo(LMAP);
  const ld=document.getElementById('lload');
  let okT=0; layer.on('tileload',()=>{okT++; if(ld) ld.hidden=true;});
  layer.on('load',()=>{ if(ld) ld.hidden=true; });
  setTimeout(()=>{ if(!okT&&ld) ld.textContent='Подложка карты не загрузилась — обновите страницу'; },15000);
  MARK={};
  PROJ.forEach(p=>{const st=stats(flatsOf(p.slug));
    const icon=L.divIcon({className:'lmk',iconSize:[0,0],html:`<div class="lpin${agentOk(p.slug)||p.slug==='izdanie'?' hot':''}"><span class="lpb">${ICON}${mln(st.min)} млн</span><span class="lpl">${esc(p.name.replace(/Квартал |[«»]/g,''))}</span></div>`});
    MARK[p.slug]=L.marker([p.lat,p.lon],{icon,riseOnHover:true,title:p.name}).addTo(LMAP).bindPopup(popHtml(p),{maxWidth:320,minWidth:260,autoPanPadding:[30,30],offset:[0,-52]});
  });
  LMAP.fitBounds(L.latLngBounds(PROJ.map(p=>[p.lat,p.lon])),{padding:[60,60]});
  const hint=document.getElementById('lhint'); if(matchMedia('(pointer:coarse)').matches) hint.hidden=true;
  LMAP.on('click focus',()=>{LMAP.scrollWheelZoom.enable(); hint.hidden=true;});
  LMAP.on('mouseout',()=>{ if(!document.getElementById('lwrap').classList.contains('on')) LMAP.scrollWheelZoom.disable(); });
  const wrap=document.getElementById('lwrap'), fb=document.getElementById('lfull');
  const setFull=on=>{wrap.classList.toggle('on',on);document.body.classList.toggle('noscroll',on);fb.textContent=on?'✕ Свернуть карту':'⤢ Развернуть карту';fb.setAttribute('aria-pressed',on);
    on?LMAP.scrollWheelZoom.enable():LMAP.scrollWheelZoom.disable(); hint.hidden=true; setTimeout(()=>LMAP.invalidateSize(),50);};
  fb.onclick=()=>setFull(!wrap.classList.contains('on'));
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&wrap.classList.contains('on')) setFull(false);});
  document.querySelectorAll('[data-fly]').forEach(b=>b.onclick=()=>{const p=BY_SLUG[b.dataset.fly];LMAP.flyTo([p.lat,p.lon],Math.max(LMAP.getZoom(),12),{duration:.6});setTimeout(()=>MARK[p.slug].openPopup(),650);});
  LMAP.on('popupopen',()=>{document.body.classList.remove('noscroll-pop')});
}

  const pr=document.getElementById('pf-pv'); if(pr){ pr.oninput=()=>{document.getElementById('pf-pvv').textContent=pr.value+'%';}; pr.onchange=()=>{PF.pv=+pr.value; redraw('pf-pv');}; }
  box.querySelectorAll('[data-gt]').forEach(b=>b.onclick=()=>{GF.term=+b.dataset.gt; redraw();});
  const r=document.getElementById('gf-pv'); if(r){ r.oninput=()=>{document.getElementById('gf-pvv').textContent=r.value+'%';}; r.onchange=()=>{GF.pv=+r.value; redraw('gf-pv');}; }
}
function detail(f){
  const p=BY_ID[f.c];
  const tc=[]; T.forEach(s=>s.cards.forEach(c=>{if(appliesTo(c,p.slug,f.b)) tc.push([s.sec,c])}));
  document.title=`${RT(f.r)}, ${f.a} м² · ${p.name}`;
  app.innerHTML=`
  <div class="back-row"><a class="pill" href="#p-${p.slug}">‹ Все квартиры ${esc(p.name)}</a><a class="pill" href="https://moskva.brusnika.ru/flat/${f.id}/" target="_blank" rel="noopener">Квартира на сайте Брусники ↗</a></div>
  <section class="detail">
    <div class="panel">${planBox(f,'dplan')}</div>
    <div class="panel">
      <span class="eyebrow">${esc(p.name)} · ${esc(f.b)}, секция ${esc(f.s)}</span>
      <h1>${RT(f.r)}, ${area(f.a)}</h1>
      ${f.bk?`<div class="warn" style="font-size:15px">Квартира забронирована на сайте застройщика. Уточните статус перед показом клиенту.</div>`:''}
      <div class="kv num">
        <div><small>Этаж</small><b>${f.fl} из ${f.ff}</b></div><div><small>Срок сдачи</small><b>${f.d}</b></div><div><small>За м²</small><b>${fmt(f.ppm)}</b></div>
        <div><small>Дом</small><b>${esc(f.b)}</b></div><div><small>Секция</small><b>${esc(f.s)}</b></div><div><small>ID на сайте</small><b>${f.id}</b></div>
      </div>
      ${f.tags.length?`<div class="chips">${f.tags.map(t=>`<span class="tg g">${esc(t)}</span>`).join('')}</div>`:''}
      <div class="pbox num">
        <div class="pline"><span>Базовая цена сайта</span><s class="black">${fmt(f.base)}</s></div>
        <div class="pline"><span>Цена сайта со скидкой</span><b class="red">${fmt(f.site)}</b></div>
        ${f.promo?`<div class="pline"><span>${f.pt==='anti_auction'?'Антиаукцион (цена снижается)':'Акция сайта до '+ddmm(f.pd)}</span><b class="black">−${fmt(f.site-f.promo)}</b></div>`:''}
        <div class="bigfinal"><small>${f.promo?'Цена с акцией':'Цена со скидкой сайта'}</small><b>${fmt(f.final)}</b><span class="save">выгода ${fmt(f.save)} (−${f.pct}%) от базовой цены</span></div>
        ${f.ag?`<div class="agent big"><span>Цена со скидкой агента ${AGENT}% <small>−${fmt(f.final-f.ag)}</small></span><b>${fmt(f.ag)}</b></div>`:`<div class="fine">Скидка агента ${AGS}% на эту квартиру не распространяется.</div>`}
      </div>
    </div>
    <div class="panel full">
      <div class="calchead"><h3>Расчёты по квартире</h3><div class="pdfrow"><button type="button" class="btn btn-main" id="pdfbtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 3v12m0 0-4-4m4 4 4-4M5 21h14"/></svg>Сохранить расчёт в PDF</button><span class="pdfmsg" id="pdfmsg" role="status"></span></div></div>
      ${CALC_FOR(f)?`<div id="calcbox">${calcHtml(f)}</div>`:`<div class="soon">Расчёты для этой квартиры пока не заданы. Сейчас они есть для квартир Издания, МОНС, Герцена (дом 2) и Первого квартала.</div>`}
    </div>
    <div class="panel full">
      <h3>Условия реализации для этой квартиры</h3>
      ${tc.length?`<div class="cards">${tc.map(([s,c])=>termCard(Object.assign({},c,{who:s+' · '+c.who}))).join('')}</div>`:`<p class="intro">Для этого проекта условия ещё не внесены.</p>`}
      <div class="note"><b>Индивидуально</b> можно попробовать согласовать отложенный ПВ до 45 дней. Все условия без удорожания, от скидочной цены сайта.</div>
    </div>
  </section>`;
  const pb=app.querySelector('#pdfbtn'); if(pb) pb.onclick=()=>savePdf(f,pb,app.querySelector('#pdfmsg'));
  if((f.slug==='gertzena'||f.slug==='perviy')&&CALC_FOR(f)) bindFam(f);
}

/* ---------- TERMS ---------- */
let tfilter='all';
function terms(){
  const opts=[['all','Все проекты'],...PROJ.filter(p=>p.slug!=='dom-a'&&p.slug!=='metronom').map(p=>[p.slug,p.name.replace(/Квартал |[«»]/g,'')])];
  const secs=T.map((s,i)=>({...s,i,cs:s.cards.filter(c=>tfilter==='all'||c.p.includes(tfilter))}));
  const tcls=['t-sky','t-peach','t-lav','t-mint'];
  const block=s=>{
    if(!s.cs.length) return '';
    let inner;
    if(s.cs.some(c=>c.grp)){
      const g=[...new Set(s.cs.map(c=>c.grp))];
      inner=g.map(n=>`<div class="grp"><h3>${n}</h3><div class="cards">${s.cs.filter(c=>c.grp===n).map(termCard).join('')}</div></div>`).join('');
    } else inner=`<div class="cards">${s.cs.map(termCard).join('')}</div>`;
    return `<section class="panel block" id="blk-${s.i}"><div class="blkhead"><span class="blknum">${s.cs.length}</span><div><h2>${s.sec}</h2><span class="fine">${s.sub}</span></div><span class="blkhi">${s.hi}</span></div>${inner}</section>`;
  };
  app.innerHTML=`
  <section class="hero">
    <div class="hero-main">
      <span class="eyebrow">Брусника · формы оплаты</span>
      <h1>Условия реализации без удорожания</h1>
      <p class="terms-line" style="font-size:18px">От скидочной цены сайта ❗️</p>
      <p>Четыре блока условий. Нажмите на блок, чтобы перейти к нему, или выберите проект, чтобы оставить только его программы.</p>
      <div class="hero-note"><b>Индивидуально</b> можно попробовать согласовать отложенный ПВ до 45 дней.</div>
    </div>
    <div class="tiles">${secs.map((s,k)=>`<button class="tile ${tcls[k]} blkjump" data-blk="${s.i}" ${s.cs.length?'':'disabled'} style="grid-column:span 3;border:0;text-align:left;${s.cs.length?'':'opacity:.45'}"><b style="font-size:26px">${s.hi}</b><span><b style="font-size:15px;font-family:var(--text)">${s.sec}</b><br>${s.cs.length} ${s.cs.length===1?'программа':s.cs.length<5?'программы':'программ'}</span></button>`).join('')}</div>
  </section>
  <div class="agent big" style="flex-wrap:wrap"><span>Скидка агента ${AGS}%${AG_WHEN}<small>${AG_RULE} Не действует на рассрочки с пометкой «Не работает акция».</small></span><b>−${AGS}%</b></div>
  <section class="panel"><h3>График скидки агента</h3><div class="tblwrap"><table class="sched"><thead><tr><th>Период</th><th>Скидка агента</th></tr></thead><tbody>
  ${AG_SCHED.map(([d,pc],k)=>{const nx=AG_SCHED[k+1]; const cur=AG_TODAY>=d&&(!nx||AG_TODAY<nx[0]); return `<tr class="${cur?'cur':''}"><td>${nx?dm(d)+' – '+dm(prevDay(nx[0])):'с '+dm(d)}${cur?' <b class="nowtag">сейчас</b>':''}</td><td class="r">${String(pc).replace('.',',')}%</td></tr>`}).join('')}
  </tbody></table></div><span class="fine">Скидка пересчитывается автоматически по дате (московское время).</span></section>
  <section class="filters">${opts.map(([v,n])=>`<button class="chip" data-t="${v}" aria-pressed="${tfilter===v}">${n}</button>`).join('')}</section>
  ${secs.map(block).join('')}
  <div class="note"><b>Индивидуально</b> можно попробовать согласовать отложенный первоначальный взнос до 45 дней.</div>`;
  app.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{tfilter=b.dataset.t;terms()});
  app.querySelectorAll('.blkjump').forEach(b=>b.onclick=()=>{const el=document.getElementById('blk-'+b.dataset.blk); if(el) el.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'})});
}

/* ---------- routing ---------- */
document.addEventListener('click',e=>{
  const hm=e.target.closest('a[href="#home"]'); if(hm){e.preventDefault(); const lw=document.getElementById('lwrap'); if(lw&&lw.classList.contains('on')) document.getElementById('lfull').click(); if(location.hash==='#home'||location.hash===''){render(); scrollTo(0,0);} else location.hash='home'; return;}
  const tf=e.target.closest('[data-tf]'); if(tf){tfilter=tf.dataset.tf; if(location.hash==='#terms') terms(); else location.hash='terms'; return;}
  const s=e.target.closest('[data-sel]'); if(s){selectProj(s.dataset.sel);}
});
const scrolls={};
let lastRoute='';
const toTop=()=>{scrollTo(0,0); requestAnimationFrame(()=>scrollTo(0,0)); setTimeout(()=>scrollTo(0,0),60);};
try{history.scrollRestoration='manual'}catch(e){}
function render(keep){
  const h=location.hash.slice(1)||'home';
  if(keep){ const kv=h.match(/^kv-(\d+)$/), pr=h.match(/^p-([a-z-]+)$/); if(kv){const f=FL.find(x=>x.id===+kv[1]); if(f) detail(f);} else if(pr && BY_SLUG[pr[1]]) projectView(pr[1]); return; }
  scrolls[lastRoute]=scrollY;
  let route='home';
  const kv=h.match(/^kv-(\d+)$/), pr=h.match(/^p-([a-z-]+)$/);
  if(kv){const f=FL.find(x=>x.id===+kv[1]); if(f){route='p-'+f.slug; loadPlans(f.slug); detail(f); nav(route); lastRoute=h; toTop(); return;}}
  document.title='Брусника для агентов';
  if(pr && BY_SLUG[pr[1]] && !BY_SLUG[pr[1]].off){route=h; projectView(pr[1]); loadPlans(pr[1]);}
  else if(h==='terms'){route='terms'; terms();}
  else home();
  nav(route);
  scrollTo(0, lastRoute.startsWith('kv-') && scrolls[h]!=null ? scrolls[h] : 0);
  lastRoute=h;
}
fetch('flats.json').then(r=>r.json()).then(d=>{const arr=Array.isArray(d)?d:d.flats; if(!Array.isArray(d)&&d.date) DATE=d.date; FL=arr.map(prep); PROJ.forEach(p=>loadPlans(p.slug)); render(); addEventListener('hashchange',()=>render());})
 .catch(()=>{app.innerHTML='<div class="empty">Не удалось загрузить список квартир. Обновите страницу.</div>'});
</script>
